name: Swarm research tests
permissions:
  contents: read
on:
  push:
    paths: ['swarm_security/**', 'tests/**', 'requirements-swarm.txt', '.github/workflows/swarm-tests.yml']
  pull_request:
    paths: ['swarm_security/**', 'tests/**', 'requirements-swarm.txt', '.github/workflows/swarm-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-swarm.txt
      - run: python -m unittest discover -s tests -v
