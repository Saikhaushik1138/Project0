name: Bug report
description: Report a problem in Project0 setup, transport, analysis, or simulation.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Remove keys, credentials, and sensitive flight data from all output. Flight logs are optional for software-only bugs."
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options: [Installation or doctor, Launcher or Gazebo, Relay or cryptography, Benchmark or analysis, Documentation, Other]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
      description: Explain what you expected, what happened, and any error message.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the exact command, drone count, security profile, and a minimal reproduction.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS/architecture, Python version, commit, and relevant doctor output. For SITL issues include PX4 and Gazebo versions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or evidence
      description: Optional redacted traceback, run manifest, relay status, or screenshot. State whether this was offline, SITL, or hardware.
