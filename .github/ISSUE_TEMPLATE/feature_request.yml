name: Feature request
description: Suggest an improvement to the research tools or developer workflow.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or research need
      description: Describe the concrete task this would help accomplish.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the command, output, or workflow you would like.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and alternatives
      description: How should success be measured? Include alternatives, interoperability concerns, or related research where relevant.
